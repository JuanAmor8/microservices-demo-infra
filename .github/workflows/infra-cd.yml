name: Infrastructure - CD Pipeline

on:
  # ── Disparado por el repo de desarrollo cuando se publica una nueva imagen ──
  repository_dispatch:
    types:
      - vote-image-updated
      - worker-image-updated
      - result-image-updated

  # ── Cambios directos en los charts de Helm ─────────────────────────────────
  push:
    branches:
      - main
      - 'infra/staging'
      - 'infra/feature/**'
    paths:
      - 'charts/**'
      - 'environments/**'
      - '.github/workflows/infra-cd.yml'

  pull_request:
    branches:
      - main
      - 'infra/staging'
    paths:
      - 'charts/**'
      - 'environments/**'

  # ── Ejecución manual con selección de ambiente ─────────────────────────────
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      service:
        description: 'Service to deploy (all = todos)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - vote
          - worker
          - result
          - infrastructure

jobs:
  # ── Stage 1: Lint & Validate todos los charts ─────────────────────────────
  helm-lint:
    name: Helm Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.17.0'

      - name: Lint infrastructure chart
        run: helm lint charts/infrastructure/

      - name: Lint vote chart
        run: helm lint charts/vote/

      - name: Lint worker chart
        run: helm lint charts/worker/

      - name: Lint result chart
        run: helm lint charts/result/

      - name: Dry-run template render (production values)
        run: |
          helm template vote charts/vote/ \
            --set image=$(cat environments/production.yaml | grep 'vote:' | awk '{print $2}') \
            --debug > /dev/null
          echo "All charts rendered successfully"

  # ── Stage 2: Deploy to Staging ────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    needs: helm-lint
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/infra/staging' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging') ||
      github.event_name == 'repository_dispatch'
    environment: staging

    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.17.0'

      - name: Determine triggered service
        id: service
        run: |
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            echo "type=${{ github.event.action }}" >> $GITHUB_OUTPUT
            echo "image=${{ github.event.client_payload.image }}" >> $GITHUB_OUTPUT
          else
            echo "type=all" >> $GITHUB_OUTPUT
          fi

      - name: Deploy infrastructure (Kafka + PostgreSQL)
        if: steps.service.outputs.type == 'all' || steps.service.outputs.type == 'infrastructure'
        run: |
          echo "=== Deploying infrastructure to STAGING ==="
          echo "helm upgrade --install infrastructure charts/infrastructure/"
          # Uncomment for real cluster:
          # helm upgrade --install infrastructure charts/infrastructure/ \
          #   --namespace staging --create-namespace --wait

      - name: Deploy vote service
        if: steps.service.outputs.type == 'all' || steps.service.outputs.type == 'vote-image-updated'
        run: |
          IMAGE="${{ steps.service.outputs.image || 'ghcr.io/juanamor8/microservices-demo/vote:develop' }}"
          echo "=== Deploying vote to STAGING with image: $IMAGE ==="
          echo "helm upgrade --install vote charts/vote/ --set image=$IMAGE"
          # Uncomment for real cluster:
          # helm upgrade --install vote charts/vote/ \
          #   --set image=$IMAGE --namespace staging --wait

      - name: Deploy worker service
        if: steps.service.outputs.type == 'all' || steps.service.outputs.type == 'worker-image-updated'
        run: |
          IMAGE="${{ steps.service.outputs.image || 'ghcr.io/juanamor8/microservices-demo/worker:develop' }}"
          echo "=== Deploying worker to STAGING with image: $IMAGE ==="
          echo "helm upgrade --install worker charts/worker/ --set image=$IMAGE"

      - name: Deploy result service
        if: steps.service.outputs.type == 'all' || steps.service.outputs.type == 'result-image-updated'
        run: |
          IMAGE="${{ steps.service.outputs.image || 'ghcr.io/juanamor8/microservices-demo/result:develop' }}"
          echo "=== Deploying result to STAGING with image: $IMAGE ==="
          echo "helm upgrade --install result charts/result/ --set image=$IMAGE"

      - name: Staging deploy summary
        run: |
          echo "✅ Staging deployment complete"
          echo "Triggered by: ${{ github.event_name }}"
          echo "Service: ${{ steps.service.outputs.type }}"

  # ── Stage 3: Deploy to Production (solo main con aprobación) ──────────────
  deploy-production:
    name: Deploy to Production
    needs: helm-lint
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment: production   # requiere aprobación manual en GitHub

    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.17.0'

      - name: Deploy infrastructure
        run: |
          echo "=== Deploying infrastructure to PRODUCTION ==="
          echo "helm upgrade --install infrastructure charts/infrastructure/"

      - name: Deploy vote service
        run: |
          echo "=== Deploying vote to PRODUCTION ==="
          echo "helm upgrade --install vote charts/vote/ \
            --set image=ghcr.io/juanamor8/microservices-demo/vote:latest"

      - name: Deploy worker service
        run: |
          echo "=== Deploying worker to PRODUCTION ==="
          echo "helm upgrade --install worker charts/worker/ \
            --set image=ghcr.io/juanamor8/microservices-demo/worker:latest"

      - name: Deploy result service
        run: |
          echo "=== Deploying result to PRODUCTION ==="
          echo "helm upgrade --install result charts/result/ \
            --set image=ghcr.io/juanamor8/microservices-demo/result:latest"

      - name: Production deploy summary
        run: |
          echo "✅ Production deployment complete"
          echo "Commit: ${{ github.sha }}"
